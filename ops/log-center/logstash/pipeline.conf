input {
  file {
    path => ["/events/*.ndjson"]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/edmir.sincedb"
    sincedb_write_interval => "1 second"
    stat_interval => "1 second"
    codec => json
    ecs_compatibility => "v8"
  }
}
filter {
  if ![event][id] or "_jsonparsefailure" in [tags] {
    mutate { add_tag => ["edmir_ingestion_failure"] }
  }
  mutate { remove_field => ["[event][original]"] }
}
output {
  if "edmir_ingestion_failure" in [tags] {
    file { path => "/usr/share/logstash/data/rejected.ndjson" codec => json_lines }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user => "edmir_writer"
      password => "${LOGSTASH_PASSWORD}"
      index => "edmir-ops-%{+YYYY.MM.dd}"
      document_id => "%{[event][id]}"
      action => "index"
      data_stream => false
      ilm_enabled => false
      manage_template => false
    }
  }
}
