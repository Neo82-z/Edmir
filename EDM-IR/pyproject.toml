[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edmir"
version = "0.1.0"
description = "Layered dataflow and multi-GPU communication-compute research compiler"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
edmir = "edmir.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["edmir*", "ir*"]
